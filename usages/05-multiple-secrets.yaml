# 05 — Several secrets into one workload, each mounted its own way.
# api-token lands as a volume, app-config as env vars — in a single SecretsManager.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-multi-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: api-token
  namespace: uc-multi-secret
type: Opaque
stringData:
  API_TOKEN: "sk-1234567890"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-config
  namespace: uc-multi-secret
type: Opaque
stringData:
  API_URL: "https://api.example.com"
  DEBUG_MODE: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: uc-multi-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend-container
          image: nginx:alpine
---
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: multi-secret-sm
  namespace: uc-multi-secret
spec:
  workloads:
    - name: frontend-app
      namespace: uc-multi-secret
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: api-token
        - name: app-config
          mountConfig:
            mountType: envFrom