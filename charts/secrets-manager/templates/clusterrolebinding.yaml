apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secrets-manager-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secrets-manager-controller-role
subjects:
  - kind: ServiceAccount
    name: secrets-manager-controller-sa
    namespace: secrets-manager-system
