apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: secrets-manager-mutating-webhook
  annotations:
    cert-manager.io/inject-ca-from: secrets-manager-system/secrets-manager-webhook-cert
webhooks:
  - name: mutate.secrets-management.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    namespaceSelector:
      matchLabels:
        secrets-manager.io/injection: "enabled"
    clientConfig:
      service:
        name: secrets-manager-webhook
        namespace: secrets-manager-system
        path: /mutate
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["*"]
        scope: Namespaced
