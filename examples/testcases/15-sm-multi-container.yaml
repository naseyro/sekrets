# CASE: volume injection must hit ALL containers of a multi-container pod.
# Expect: both containers (nginx and sidecar) of `app-multi-container`
# get volume `test-ci-creds-volume` mounted at /etc/ci.
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: case-multi-container
  namespace: default
spec:
  workloads:
    - name: app-multi-container
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: test-ci-creds
          mountConfig:
            mountType: volume
            mountPath: /etc/ci