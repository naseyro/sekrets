# CASE: one SecretsManager targeting several workloads of DIFFERENT kinds.
# Expect:
#   - Deployment  `app-other` -> volume test-ci-creds-volume at default path
#   - StatefulSet `web-sts`   -> env var ST_DB_PASSWORD (test-db-creds/password)
#   - DaemonSet   `log-agent-ds` -> envFrom app-config (DEBUG, LOG_LEVEL, API_URL)
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: case-multi-workload-kinds
  namespace: default
spec:
  workloads:
    - name: app-other
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: test-ci-creds
    - name: web-sts
      kind: StatefulSet
      apiVersion: apps/v1
      secrets:
        - name: test-db-creds
          mountConfig:
            mountType: env
            envName: ST_DB_PASSWORD
            secretKey: password
    - name: log-agent-ds
      kind: DaemonSet
      apiVersion: apps/v1
      secrets:
        - name: app-config
          mountConfig:
            mountType: envFrom