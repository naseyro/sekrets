# Secrets living in the prod namespace, referenced by the cross-namespace test case.
# NOTE: secret events only trigger a SecretsManager in the SAME namespace as the secret,
# so a secret in `prod` will not re-sync the `default`-namespace SecretsManager when it
# changes. Apply the SecretsManager (or any workload it targets) to re-trigger a sync.
apiVersion: v1
kind: Secret
metadata:
  name: test-db-creds
  namespace: prod
type: Opaque
stringData:
  password: "super-secret-db-prod"
