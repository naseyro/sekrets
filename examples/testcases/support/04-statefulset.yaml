apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-sts
  namespace: default
  labels:
    app: web-sts
spec:
  serviceName: web-sts
  replicas: 1
  selector:
    matchLabels:
      app: web-sts
  template:
    metadata:
      labels:
        app: web-sts
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
