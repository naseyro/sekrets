# NEGATIVE CASES — the controller must skip gracefully without crashing:
#   - workload `ghost-app` does not exist            -> skipped (IsNotFound)
#   - secret `ghost-secret` does not exist anywhere  -> that secret is skipped, the
#     other secrets on the same workload still get injected
# Expect: app-env gets volume test-ci-creds-volume at default path; no errors in controller logs.
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: case-missing-resources
  namespace: default
spec:
  workloads:
    - name: ghost-app
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: test-db-creds
    - name: app-env
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: ghost-secret
        - name: test-ci-creds