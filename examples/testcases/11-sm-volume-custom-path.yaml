# CASE: volume mount with a custom mountPath.
# Expect: Deployment `app-vol-custom` gets volume `test-db-creds-volume` mounted at /opt/creds.
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: case-vol-custom-path
  namespace: default
spec:
  workloads:
    - name: app-vol-custom
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: test-db-creds
          mountConfig:
            mountType: volume
            mountPath: /opt/creds