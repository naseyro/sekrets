# CASE: secrets that do NOT exist yet when the SecretsManager is applied.
# Apply this SecretsManager first: the missing secret is skipped and nothing is injected.
# Then apply 18b-late-secret.yaml: the secret event must trigger the controller
# (the informer index matches by secret name + namespace) and inject the env var.
# Expected flow:
#   kubectl apply -f 18-sm-late-secret.yaml      # nothing happens yet
#   kubectl apply -f 18b-late-secret.yaml        # LATE_TOKEN appears on app-late
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: case-late-secret
  namespace: default
spec:
  workloads:
    - name: app-late
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: late-secret
          mountConfig:
            mountType: env
            envName: LATE_TOKEN
            secretKey: token