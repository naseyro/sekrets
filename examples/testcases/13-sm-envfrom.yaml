# CASE: envFrom mount — every key of the secret becomes an env var.
# Expect: Deployment `app-envfrom` gets envFrom secretRef app-config,
# injecting DEBUG, LOG_LEVEL and API_URL env vars.
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: case-env-from
  namespace: default
spec:
  workloads:
    - name: app-envfrom
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: app-config
          mountConfig:
            mountType: envFrom