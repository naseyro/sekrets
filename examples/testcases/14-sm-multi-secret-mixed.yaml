# CASE: several secrets with different mount types on ONE workload.
# Expect Deployment `app-mixed`:
#   - test-ci-creds  -> volume test-ci-creds-volume at /etc/secrets/test-ci-creds (default)
#   - test-db-creds  -> env var DB_PASSWORD (test-db-creds/password)
#   - app-config     -> envFrom (DEBUG, LOG_LEVEL, API_URL)
apiVersion: secrets.management.io/v1
kind: SecretsManager
metadata:
  name: case-multi-secret-mixed
  namespace: default
spec:
  workloads:
    - name: app-mixed
      kind: Deployment
      apiVersion: apps/v1
      secrets:
        - name: test-ci-creds
        - name: test-db-creds
          mountConfig:
            mountType: env
            envName: DB_PASSWORD
            secretKey: password
        - name: app-config
          mountConfig:
            mountType: envFrom