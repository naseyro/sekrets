apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretsmanagers.secrets.management.io
spec:
  group: secrets.management.io
  names:
    kind: SecretsManager
    plural: secretsmanagers
    singular: secretsmanager
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - workloads
              properties:
                workloads:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - kind
                      - apiVersion
                      - secrets
                    properties:
                      name:
                        type: string
                      kind:
                        type: string
                      apiVersion:
                        type: string
                      namespace:
                        type: string
                      secrets:
                        type: array
                        items:
                          type: object
                          required:
                            - name
                          properties:
                            name:
                              type: string
                            mountConfig:
                              type: object
                              required:
                                - mountType
                              properties:
                                mountType:
                                  type: string
                                  enum:
                                    - volume
                                    - env
                                    - envFrom
                                mountPath:
                                  type: string
                                envName:
                                  type: string
                                secretKey:
                                  type: string
                              x-kubernetes-validations:
                                - rule: "self.mountType == 'volume' ? has(self.mountPath) : true"
                                  message: "mountPath is strictly required when mountType is 'volume'."
                                - rule: "self.mountType == 'volume' ? !has(self.envName) && !has(self.secretKey) : true"
                                  message: "envName and secretKey are strictly forbidden when mountType is 'volume'."
                                - rule: "self.mountType == 'env' ? has(self.envName) && has(self.secretKey) : true"
                                  message: "Both envName and secretKey are strictly required when mountType is 'env'."
                                - rule: "self.mountType == 'env' ? !has(self.mountPath) : true"
                                  message: "mountPath is strictly forbidden when mountType is 'env'."
                                - rule: "self.mountType == 'envFrom' ? !has(self.mountPath) && !has(self.envName) && !has(self.secretKey) : true"
                                  message: "mountPath, envName, and secretKey are all strictly forbidden when mountType is 'envFrom'."
