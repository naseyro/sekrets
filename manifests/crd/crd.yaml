apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: secretsmanagers.secrets.management.io
spec:
  group: secrets.management.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                secretRefs:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        targetWorkloads:
                          type: array
                          items:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                name:
                                  type: string
                                kind:
                                  type: string
                                apiVersion:
                                  type: string
                                namespace:
                                  type: string
                                mountConfig:
                                  type: object
                                  properties:
                                    mountType:
                                      type: string
                                    mountPath:
                                      type: string
                                    envName:
                                      type: string
                                    secretkey:
                                      type: string
  names:
    kind: SecretsManager
    plural: secretsmanagers
    singular: secretsmanager
  scope: Namespaced
